[project]
name = "alpha-firewall"
version = "0.1.0"
description = "Controlled benchmarks for backtest overfitting in autonomous alpha research"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Raphael Caillon" },
]
license = "MIT"
keywords = [
  "adaptive data analysis",
  "autonomous agents",
  "backtest overfitting",
  "quantitative finance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
alpha-firewall = "alpha_firewall.cli:main"

[project.urls]
Paper = "https://github.com/Noptus/backtests-as-reward-signals/blob/main/output/pdf/backtests_as_reward_signals.pdf"
Repository = "https://github.com/Noptus/backtests-as-reward-signals"
Issues = "https://github.com/Noptus/backtests-as-reward-signals/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
